<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#fff7fb">
  <title>Tính Nhanh</title>
  <link rel="icon" href="assets/icon-256.png">
  <link rel="stylesheet" href="styles.css?v=3.1.0">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="closeGameBtn" class="icon-btn" type="button" aria-label="Quay lại Kanban">←</button>
      <div class="brand"><img src="assets/icon-256.png" alt=""><div><b>Tính Nhanh</b><span id="slotNameTop">Hồ sơ 1</span></div></div>
      <button id="quickSlotBtn" class="pill-btn" type="button">3 hồ sơ</button>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Điều hướng">
      <button data-nav="home" class="nav-btn active"><span>🏡</span><b>Hôm nay</b></button>
      <button data-nav="skills" class="nav-btn"><span>🌱</span><b>Kỹ năng</b></button>
      <button data-nav="memory" class="nav-btn"><span>🧠</span><b>Trí nhớ</b></button>
      <button data-nav="progress" class="nav-btn"><span>📈</span><b>Tiến bộ</b></button>
      <button data-nav="profile" class="nav-btn"><span>🐣</span><b>Hồ sơ</b></button>
    </nav>
  </div>
  <div id="modalRoot"></div>
  <script src="skills.js?v=3.1.0"></script>
  <script src="core.js?v=3.1.0"></script>
  <script src="app.js?v=3.1.0"></script>
</body>
</html>
