<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123b31">
  <title>Dice Arena</title>
  <link rel="stylesheet" href="styles.css?v=5.2.0">
</head>
<body>
  <main class="dice-app">
    <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
    <header class="topbar">
      <div class="brand"><div class="brand-cube" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div><span>TRÒ CHƠI NHẸ</span><h1>DICE ARENA</h1><p>Chọn xúc xắc 6 mặt hoặc 10 mặt</p></div></div>
      <div class="top-actions"><button id="soundBtn" class="icon-btn active" type="button" title="Bật hoặc tắt âm thanh">♪</button><button id="fullscreenBtn" class="icon-btn" type="button" title="Toàn màn hình">⛶</button><button id="closeDiceBtn" class="back-btn" type="button">Quay về Kanban</button></div>
    </header>
    <section class="game-shell">
      <aside class="control-panel glass">
        <span class="eyebrow">THIẾT LẬP</span><h2>Chọn xúc xắc</h2>
        <label class="die-type-field"><span>Loại xúc xắc</span><select id="dieTypeSelect" aria-label="Loại xúc xắc"><option value="d6">D6 – số 1 đến 6</option><option value="d10">D10 – số 0 đến 9</option></select></label>
        <div class="counter"><button id="minusBtn" type="button">−</button><output id="countOutput">3</output><button id="plusBtn" type="button">＋</button></div>
        <input id="countRange" type="range" min="1" max="10" value="3" step="1" aria-label="Số lượng xúc xắc">
        <button id="rollBtn" class="primary-btn" type="button">Thả xúc xắc</button>
        <button id="clearBtn" class="secondary-btn" type="button">Dọn bàn</button>
        <div class="result-box"><div><span>Chế độ</span><strong id="modeLabel">Chưa thả</strong></div><div><span>Tổng điểm</span><strong id="totalLabel">—</strong></div></div>
        <div id="valueList" class="value-list"><span>Chưa có kết quả.</span></div>
      </aside>
      <section class="arena-wrap">
        <div class="arena-frame">
          <div class="arena-table"><div class="table-logo">DICE ARENA</div><div id="diceStage" class="dice-stage"></div></div>
          <div class="wood-edge edge-top"></div><div class="wood-edge edge-bottom"></div><div class="wood-edge edge-left"></div><div class="wood-edge edge-right"></div>
          <div class="cup" aria-hidden="true"><div class="cup-rim"></div><div class="cup-body"></div></div>
        </div>
        <div id="statusText" class="status-pill">Sẵn sàng.</div>
      </section>
      <aside class="history-panel glass"><div class="history-head"><div><span class="eyebrow">LỊCH SỬ</span><h2>10 lượt gần nhất</h2></div><button id="clearHistoryBtn" type="button">Xóa</button></div><div id="historyList" class="history-list"><span>Chưa có lượt thả.</span></div></aside>
    </section>
    <dialog id="modeDialog" class="mode-dialog"><form method="dialog" class="mode-card"><div class="dialog-head"><div><span class="eyebrow">CHỌN CÁCH THẢ</span><h2><b id="dialogCount">3</b> xúc xắc <span id="dialogDieType">D6</span></h2></div><button value="cancel" aria-label="Đóng">×</button></div><div class="mode-grid"><button id="togetherBtn" type="button" class="mode-option"><div class="mode-dice">◆◆◆</div><strong>Thả đồng thời</strong><span>Tất cả xúc xắc lăn cùng lúc.</span></button><button id="sequenceBtn" type="button" class="mode-option"><div class="mode-dice">◆ → ◆ → ◆</div><strong>Thả từng viên</strong><span>Hiện kết quả lần lượt từng viên.</span></button></div></form></dialog>
    <div id="toast" class="toast" role="status"></div>
  </main>
  <script type="module" src="js/app.js?v=5.2.0"></script>
</body>
</html>
