name: Build KanAquarium 3D
on:
  push:
    branches: [kanaquarium-3d-integration, kanaquarium-food-drop-fix, kanaquarium-visible-food-test, kanaquarium-vietnamese-food-v13, kanaquarium-auto-panel-alt-h-v14, kanaquarium-realism1-physics, kanaquarium-realism2-lifelike, kanaquarium-realism2-wall-hotfix, kanaquarium-realism3-ecosystem, kanaquarium-food-3d-click-depth, kanaquarium-realism4-fins-habitats, kanaquarium-realism4-visual-hotfix-fins-logs, kanaquarium-angelfish-swim-and-fins-hotfix, main]
    paths:
      - '.github/workflows/kanaquarium-build.yml'
      - 'aquarium-integration/**'
  pull_request:
    paths: ['.github/workflows/kanaquarium-build.yml', 'aquarium-integration/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-aquarium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: jamisonhill/aquarium
          ref: 2a6e16ce5df82b858183c02624d2ac5e605faec5
          path: _aquarium-build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _aquarium-build/package-lock.json
      - name: Install KanAquarium overrides
        run: |
          cp -r aquarium-integration/overrides/. _aquarium-build/src/
          mkdir -p _aquarium-build/public/feed-items
          cp aquarium-integration/feed-items/* _aquarium-build/public/feed-items/
          tar -xzf aquarium-integration/food-specials.tar.gz -C _aquarium-build/public/feed-items/
      - name: Build
        run: |
          cd _aquarium-build
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Chromium if missing
        run: |
          if ! command -v google-chrome && ! command -v chromium; then
            sudo apt-get update -qq
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          fi
      - name: Browser smoke test - visible food and small cookies
        run: |
          cp aquarium-integration/tests/food-smoke.mjs _aquarium-build/food-smoke.mjs
          cd _aquarium-build
          node food-smoke.mjs
      - name: Browser food click ray / variable water depth (3D)
        run: |
          cp aquarium-integration/tests/food3d-smoke.mjs _aquarium-build/food3d-smoke.mjs
          cd _aquarium-build
          node food3d-smoke.mjs
      - name: Browser Realism 4 - flexible fins, habitats, 20 event classes, 60 fish
        run: |
          cp aquarium-integration/tests/realism4-habitats-smoke.mjs _aquarium-build/realism4-habitats-smoke.mjs
          cd _aquarium-build
          node realism4-habitats-smoke.mjs
      - name: Browser visual hotfix - flexible angelfish fins and solid-round driftwood
        run: |
          cp aquarium-integration/tests/realism4-visual-hotfix-smoke.mjs _aquarium-build/realism4-visual-hotfix-smoke.mjs
          cd _aquarium-build
          node realism4-visual-hotfix-smoke.mjs
      - name: Keep before-and-after aquarium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realism4-visual-hotfix-review
          path: |
            _aquarium-build/realism4-visual-fins-soft.png
            _aquarium-build/realism4-visual-fins-classic.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Browser angelfish swim-motion tracking in open and furnished tanks
        run: |
          cp aquarium-integration/tests/angelfish-motion-smoke.mjs _aquarium-build/angelfish-motion-smoke.mjs
          cd _aquarium-build
          node angelfish-motion-smoke.mjs
      - name: Preserve angelfish motion screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angelfish-motion-review
          path: |
            _aquarium-build/angelfish-motion-open-water.png
            _aquarium-build/angelfish-motion-with-wood.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Browser Realism 3 - ecology, modes and autonomous fish behavior
        run: |
          cp aquarium-integration/tests/realism3-smoke.mjs _aquarium-build/realism3-smoke.mjs
          cd _aquarium-build
          node realism3-smoke.mjs
      - name: Browser Realism 2 - species meshes, optics and legacy names
        run: |
          cp aquarium-integration/tests/realism2-smoke.mjs _aquarium-build/realism2-smoke.mjs
          cd _aquarium-build
          node realism2-smoke.mjs
      - name: Browser realism regression - tank bounds, plants, food depth
        run: |
          cp aquarium-integration/tests/realism-smoke.mjs _aquarium-build/realism-smoke.mjs
          cd _aquarium-build
          node realism-smoke.mjs
      - name: Realism 4.2 - 100 fish, resizing, peck, breach and camera gestures
        run: |
          cp aquarium-integration/tests/realism42-smoke.mjs _aquarium-build/realism42-smoke.mjs
          cd _aquarium-build
          node realism42-smoke.mjs
      - name: Preserve Realism 4.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realism42-review
          path: |
            _aquarium-build/realism42-*.png
            _aquarium-build/realism42-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit compiled game into site
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf aquarium-game
          mkdir -p aquarium-game
          cp -r _aquarium-build/dist/. aquarium-game/
          printf 'Base project: https://github.com/jamisonhill/aquarium\nLicense: MIT (see upstream LICENSES.md)\nCustomized for KanBan.\n' > aquarium-game/LICENSE_SOURCE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aquarium-game
          if ! git diff --cached --quiet; then
            git commit -m "build: compile KanAquarium 3D for GitHub Pages"
            git push
          fi
