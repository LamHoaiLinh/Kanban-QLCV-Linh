name: Check KanBan Tools

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
    paths:
      - 'kan-tools/**'
      - 'capture-agent/**'
      - 'office-tools/office-tools.js'
      - 'office-tools/office-tools.css'
      - 'office-tools/kanmedia/**'
      - 'kantool-launcher.js'
      - 'kantool-extra.css'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - '.github/workflows/check-kantools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Python syntax
        shell: pwsh
        run: python -m py_compile kan-tools/runtime/kanmedia-server.py kan-tools/runtime/kanmedia-worker.py capture-agent/capture_agent.py capture-agent/kanpass.py capture-agent/kanpass_webbridge.py office-tools/signing-agent/package/kanban_signing_agent.py

      - name: Smoke test KanPass KDBX and Windows DPAPI
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pykeepass websocket-client
          @'
          import shutil, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'capture-agent')
          import kanpass
          secret=b'kanpass-dpapi-smoke'
          assert kanpass.dpapi_unprotect(kanpass.dpapi_protect(secret)) == secret
          root=Path(tempfile.mkdtemp(prefix='kanpass-ci-'))
          try:
              manager=kanpass.KanPassManager(None, root)
              manager.setup('KanPass-Smoke-123')
              item=manager.save_item({'title':'MB - Test','service':'MB Bank','company':'Test','company_id':'COMP01','username':'user','password':'secret-A','field_order':'company_id,username,password'})
              manager.save_item({**item,'password':'secret-B'})
              revealed=manager.get_item(item['id'], reveal=True)
              assert revealed['password']=='secret-B'
              assert revealed['history'][0]['password']=='secret-A'
              tax_item=manager.save_item({'title':'Thuế - Bình Tân','service':'Thuế điện tử','company':'CÔNG TY TNHH ĐÀO TẠO LÁI XE BÌNH TÂN','tax_id':'0319460837','username':'tax-user','password':'tax-secret','field_order':'tax_id,password'})
              guessed=manager._guess_login_fields({'title':'MBBank Digital Banking Corp - Google Chrome','exe':'chrome.exe'}, ['0319460837','linh-user'])
              assert guessed['service']=='MB Bank'
              assert guessed['company_id']=='0319460837'
              assert guessed['username']=='linh-user'
              assert guessed['company']=='CÔNG TY TNHH ĐÀO TẠO LÁI XE BÌNH TÂN'
              browser_item=manager.save_item({'title':'MB Bank Browser','service':'MB Bank','window_match':'MBBank Digital Banking Corp - Google Chrome','app_exe':'chrome.exe','password':'browser-secret','field_order':'password'})
              ctx={'title':'MBBank Digital Banking Corp','exe':'chrome.exe'}
              assert manager._context_matches(browser_item,ctx) >= 9
              matched=manager.matches_for_context(ctx)
              assert any(x['id']==browser_item['id'] for x in matched)
              from kanpass_webbridge import KanPassWebBridge
              bridge=object.__new__(KanPassWebBridge)
              bridge.kanpass=manager
              dom=bridge.parse_dom_candidate({
                  'href':'https://example-bank.test/login',
                  'host':'example-bank.test',
                  'title':'MBBank Digital Banking Corp',
                  'fields':[
                      {'type':'text','name':'companyId','label':'Company ID','value':'0319460837'},
                      {'type':'text','name':'username','label':'Tên đăng nhập','value':'demo-user'},
                      {'type':'password','name':'password','label':'Mật khẩu','value':'demo-value'}
                  ]
              })
              assert dom['service']=='MB Bank'
              assert dom['company_id']=='0319460837'
              assert dom['username']=='demo-user'
              assert dom['company']=='CÔNG TY TNHH ĐÀO TẠO LÁI XE BÌNH TÂN'
              assert dom['url']=='https://example-bank.test'
              assert manager.export_backup()['encrypted'] is True
              print('KanPass KDBX + DPAPI + DOM/CDP inference OK')
          finally:
              shutil.rmtree(root, ignore_errors=True)
          '@ | python -

      - name: Validate KanBackup payload recovery
        shell: pwsh
        run: |
          @'
          import base64, pathlib, zlib
          p=pathlib.Path('kan-tools/runtime/kanbackup-server.py.gz.b64')
          s=''.join(p.read_text(encoding='utf-8').split())
          required=('linh-kanbackup-v1','/status','/setup','/backup-now','/snapshots','/verify','/restore')
          def raw_deflate(candidate):
              try:
                  raw=base64.b64decode(candidate,validate=True)
                  if len(raw)<20 or raw[:3]!=b'\x1f\x8b\x08': return None
                  flags=raw[3]; pos=10
                  if flags & 4:
                      if pos+2>len(raw)-8:return None
                      xlen=raw[pos] | (raw[pos+1]<<8);pos+=2+xlen
                  for mask in (8,16):
                      if flags & mask:
                          while pos<len(raw)-8 and raw[pos]!=0:pos+=1
                          pos+=1
                  if flags & 2:pos+=2
                  out=zlib.decompress(raw[pos:-8],-zlib.MAX_WBITS)
                  text=out.decode('utf-8')
                  if len(out)<12000 or not all(x in text for x in required):return None
                  compile(text,'kanbackup-server.py','exec')
                  return raw,out,text
              except Exception:
                  return None
          hit=raw_deflate(s)
          if hit:
              print('KANBACKUP_PAYLOAD_DEFLATE_VALID',len(hit[0]),len(hit[1]))
              raise SystemExit(0)
          found=[]
          for i in range(max(0,len(s)-2)):
              candidate=s[:i]+s[i+1:]
              if len(candidate)%4:continue
              hit=raw_deflate(candidate)
              if hit:
                  found.append((i,s[i],candidate,len(hit[0]),len(hit[1])))
                  print('KANBACKUP_REPAIR_INDEX',i,'CHAR',repr(s[i]),'RAW',len(hit[0]),'OUT',len(hit[1]))
          if len(found)!=1:
              raise SystemExit('Khong tim duoc duy nhat 1 cach sua payload DEFLATE; candidates=%d' % len(found))
          print('KANBACKUP_REPAIR_UNIQUE',found[0][0],repr(found[0][1]))
          '@ | python -

      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'kan-tools/install.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Check manifest JSON
        shell: pwsh
        run: Get-Content 'kan-tools/manifest.json' -Raw | ConvertFrom-Json | Out-Null

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check app.js
          node --check sw.js
          node --check kantool-launcher.js
          node --check capture-launcher.js
          Copy-Item office-tools/office-tools.js "$env:RUNNER_TEMP\office-tools-check.mjs"
          Copy-Item office-tools/kanmedia/kanmedia.js "$env:RUNNER_TEMP\kanmedia-check.mjs"
          node --check "$env:RUNNER_TEMP\office-tools-check.mjs"
          node --check "$env:RUNNER_TEMP\kanmedia-check.mjs"
