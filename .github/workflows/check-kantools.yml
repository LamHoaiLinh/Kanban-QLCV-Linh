name: Check KanBan Tools

on:
  push:
    branches: [ main, 'feature/**' ]
    paths:
      - 'kan-tools/**'
      - 'capture-agent/**'
      - 'office-tools/office-tools.js'
      - 'office-tools/office-tools.css'
      - 'office-tools/kanmedia/**'
      - 'kantool-launcher.js'
      - 'kantool-extra.css'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - '.github/workflows/check-kantools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Python syntax
        shell: pwsh
        run: python -m py_compile kan-tools/runtime/kanmedia-server.py kan-tools/runtime/kanmedia-worker.py capture-agent/capture_agent.py capture-agent/kanpass.py office-tools/signing-agent/package/kanban_signing_agent.py

      - name: Smoke test KanPass KDBX
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pykeepass
          python -c "import os,tempfile,sys; from pykeepass import create_database,PyKeePass; p=os.path.join(tempfile.gettempdir(),'kanpass-ci.kdbx'); kp=create_database(p,password='KanPass-Smoke-123'); kp.add_entry(kp.root_group,'MB - Test','user','secret',notes='KANPASS_META_V1\\n{}'); kp.save(); kp2=PyKeePass(p,password='KanPass-Smoke-123'); assert kp2.entries[0].password=='secret'; os.remove(p); sys.path.insert(0,'capture-agent'); import kanpass; assert kanpass.MAX_HISTORY==5; print('KanPass KDBX OK')"

      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'kan-tools/install.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Check manifest JSON
        shell: pwsh
        run: Get-Content 'kan-tools/manifest.json' -Raw | ConvertFrom-Json | Out-Null

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check app.js
          node --check sw.js
          node --check kantool-launcher.js
          node --check capture-launcher.js
          Copy-Item office-tools/office-tools.js "$env:RUNNER_TEMP\office-tools-check.mjs"
          Copy-Item office-tools/kanmedia/kanmedia.js "$env:RUNNER_TEMP\kanmedia-check.mjs"
          node --check "$env:RUNNER_TEMP\office-tools-check.mjs"
          node --check "$env:RUNNER_TEMP\kanmedia-check.mjs"
