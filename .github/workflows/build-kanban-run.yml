name: Build KANBAN RUN APK
on:
  push:
    branches: [ "kanban-run-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore KANBAN RUN v0.4 source
        shell: bash
        run: |
          set -euo pipefail
          cat .kanban_v03/part00.txt .kanban_v03/part01.txt .kanban_v03/seg1.txt .kanban_v03/seg2.txt .kanban_v03/seg3.txt > /tmp/kanban.b64
          base64 -d /tmp/kanban.b64 > /tmp/kanban.zip
          unzip -q /tmp/kanban.zip -d .

          PATCH_DIR=".kanban_v04"
          JAVA_DIR="KANBAN_RUN/app/src/main/java/vn/kanban/run"
          base64 -d "$PATCH_DIR/MainActivity.java.gz.b64" | gzip -dc > "$JAVA_DIR/MainActivity.java"
          base64 -d "$PATCH_DIR/OfflineMapActivity.java.gz.b64" | gzip -dc > "$JAVA_DIR/OfflineMapActivity.java"
          base64 -d "$PATCH_DIR/RoutePlanner.java.gz.b64" | gzip -dc > "$JAVA_DIR/RoutePlanner.java"
          base64 -d "$PATCH_DIR/UiKit.java.gz.b64" | gzip -dc > "$JAVA_DIR/UiKit.java"

          sed -i 's/versionCode 3/versionCode 4/g' KANBAN_RUN/app/build.gradle
          sed -i 's/versionName "0.3.0"/versionName "0.4.0"/g' KANBAN_RUN/app/build.gradle
          sed -i 's/0.30.0/0.25.0/g' KANBAN_RUN/app/build.gradle
          sed -i "/com.caverock:androidsvg-aar/d" KANBAN_RUN/app/build.gradle

          grep -n "versionCode\|versionName\|mapsforge" KANBAN_RUN/app/build.gradle
          test -s "$JAVA_DIR/MainActivity.java"
          test -s "$JAVA_DIR/OfflineMapActivity.java"
          test -s "$JAVA_DIR/RoutePlanner.java"
          test -s "$JAVA_DIR/UiKit.java"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          cd KANBAN_RUN
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk KANBAN_RUN_v0.4.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KANBAN_RUN_APK_v0.4.0
          path: KANBAN_RUN/KANBAN_RUN_v0.4.0.apk
          if-no-files-found: error
