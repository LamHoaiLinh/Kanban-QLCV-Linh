name: Build KANBAN RUN APK
on:
  push:
    branches: [ "kanban-run-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore KANBAN RUN v0.2 source
        shell: bash
        run: |
          cat .kanban_v02/part1.txt .kanban_v02/part2.txt .kanban_v02/part3.txt .kanban_v02/part4.txt .kanban_v02/part5.txt > /tmp/kanban.b64
          base64 -d /tmp/kanban.b64 > /tmp/kanban.zip
          unzip -q /tmp/kanban.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        shell: bash
        run: |
          cd KANBAN_RUN
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk KANBAN_RUN_v0.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KANBAN_RUN_APK_v0.2.0
          path: KANBAN_RUN/KANBAN_RUN_v0.2.0.apk
          if-no-files-found: error
