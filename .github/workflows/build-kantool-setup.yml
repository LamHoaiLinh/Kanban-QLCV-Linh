name: Build and Publish KanTool Setup EXE

on:
  push:
    branches: [main]
    paths:
      - 'kan-tools/installer/**'
      - 'kan-tools/install.ps1'
      - 'kan-tools/manifest.json'
      - '.github/workflows/build-kantool-setup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kantool-setup-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'kan-tools/install.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Build single-file 64-bit Windows GUI installer
        shell: pwsh
        run: |
          dotnet publish kan-tools/installer/KanTool.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/kan-tool-setup
          if($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $exe='out/kan-tool-setup/KanTool-Setup.exe'
          if(-not (Test-Path $exe)) { throw 'Missing compiled installer' }
          $file=Get-Item $exe
          if($file.Length -lt 3000000) { throw 'Installer EXE too small' }
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $exe))
          if($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Not Windows PE' }
          Write-Host "Installer size: $($file.Length) bytes"
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Native EXE self-test (no window)
        shell: pwsh
        run: |
          & 'out/kan-tool-setup/KanTool-Setup.exe' --self-test
          if($LASTEXITCODE -ne 0) { throw "Native self-test failed: $LASTEXITCODE" }

      - name: Publish artifact for workflow download
        uses: actions/upload-artifact@v4
        with:
          name: KanTool-Setup-win-x64
          path: out/kan-tool-setup/KanTool-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable download asset to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'kantool-installer-latest'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'KanTool Setup - Windows x64' --notes 'Online bootstrapper with GUI, progress tracking, install/update/repair. KanScan requires its existing local source ZIP. No code signing certificate is configured.' --latest=false
            if($LASTEXITCODE -ne 0) { throw 'Failed creating KanTool release' }
          }
          gh release upload $tag 'out/kan-tool-setup/KanTool-Setup.exe' --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0) { throw 'Failed publishing KanTool-Setup.exe' }
          Write-Host "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/KanTool-Setup.exe"
