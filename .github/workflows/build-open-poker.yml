name: Build Open Poker for Kanban

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-open-poker.yml"
      - ".github/scripts/customize_open_poker.py"
      - ".github/scripts/enhance_open_poker_ux.py"
      - ".github/scripts/balatro_core_parity.py"
      - ".github/scripts/balatro_shop_parity.py"
      - ".github/scripts/balatro_l3_tests.py"
      - ".github/scripts/balatro_l3_ui.py"
      - ".github/scripts/balatro_progression_core.py"
      - ".github/scripts/balatro_joker_exact_tests.py"
      - ".github/scripts/balatro_mythic_ui.py"
      - ".github/scripts/balatro_joker_exact_parity.py"
      - ".github/scripts/balatro_meta_tests.py"
      - ".github/scripts/balatro_meta_ui.py"
      - ".github/scripts/balatro_meta_core.py"
      - ".github/scripts/balatro_content_tests.py"
      - ".github/scripts/balatro_content_parity.py"
      - ".github/scripts/balatro_meta_exact_tests.py"
      - ".github/scripts/balatro_meta_exact.py"
      - ".github/scripts/balatro_mobile_portrait.py"
      - ".github/scripts/balatro_reliability_cert.py"

permissions:
  contents: write

concurrency:
  group: build-open-poker-kanban
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kanban
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Open Poker
        run: |
          set -euo pipefail
          rm -rf .open-poker-build
          git clone --depth 1 https://github.com/alexis-labs/open-poker.git .open-poker-build

      - name: Apply Kanban customization
        run: |
          python3 .github/scripts/customize_open_poker.py .open-poker-build
          python3 .github/scripts/enhance_open_poker_ux.py .open-poker-build
          python3 .github/scripts/balatro_core_parity.py .open-poker-build
          python3 .github/scripts/balatro_shop_parity.py .open-poker-build
          python3 .github/scripts/balatro_progression_core.py .open-poker-build
          python3 .github/scripts/balatro_l3_ui.py .open-poker-build
          python3 .github/scripts/balatro_l3_tests.py .open-poker-build
          python3 .github/scripts/balatro_joker_exact_parity.py .open-poker-build
          python3 .github/scripts/balatro_mythic_ui.py .open-poker-build
          python3 .github/scripts/balatro_joker_exact_tests.py .open-poker-build
          python3 .github/scripts/balatro_meta_core.py .open-poker-build
          python3 .github/scripts/balatro_meta_ui.py .open-poker-build
          python3 .github/scripts/balatro_meta_tests.py .open-poker-build
          python3 .github/scripts/balatro_content_parity.py .open-poker-build
          python3 .github/scripts/balatro_content_tests.py .open-poker-build
          python3 .github/scripts/balatro_meta_exact.py .open-poker-build
          python3 .github/scripts/balatro_meta_exact_tests.py .open-poker-build
          python3 .github/scripts/balatro_mobile_portrait.py .open-poker-build
          python3 .github/scripts/balatro_reliability_cert.py .open-poker-build

      - name: Build Open Poker
        run: |
          set -euo pipefail
          cd .open-poker-build
          npm ci --no-audit --no-fund
          npm run gen-art
          npm run typecheck
          RELIABILITY_SEEDS=750 npm run test
          npm run build

      - name: Stage game for Kanban
        run: |
          set -euo pipefail
          rm -rf open-poker-game
          mkdir -p open-poker-game
          cp -a .open-poker-build/dist/. open-poker-game/
          cp .open-poker-build/LICENSE open-poker-game/LICENSE_OPEN_POKER.txt
          printf '%s\n' \
            'Open Poker integration for Kanban-QLCV-Linh' \
            'Upstream: https://github.com/alexis-labs/open-poker' \
            'License: MIT (see LICENSE_OPEN_POKER.txt)' \
            'Kanban customizations:' \
            '- Card ranks 2..A enlarged more than 2x for readability' \
            '- Sort Hand: Straight (S)' \
            '- Sort Hand: Flush (F) with sticky auto-sort' \
            '- Play Hand hotkey: Left/Right Ctrl' \
            '- Discard hotkey: Left/Right Shift' \
            '- Run Info: hand level, Chips x Mult, played count' \
            '- Options: SFX, music, new run, save and return' \
            '- Current run autosaves/restores; ESC closes panel or returns to Kanban' \
            '- Balatro Core Parity: ordered scoring/retriggers/held-card/Joker pass' \
            '- Full playing-card modifiers: enhancements, seals, editions' \
            '- Deterministic Lucky/Glass rolls + Glass shatter + money effects' \
            '- Drag Joker order affects scoring left-to-right' \
            '- Balatro Shop parity: 2 shop cards + 2 Booster Packs + Voucher' \
            '- Arcana/Celestial/Standard/Buffoon/Spectral packs with Normal/Jumbo/Mega' \
            '- Tarot/Spectral target selection + Planet immediate upgrades' \
            '- Interest, unused-hand cashout, pack/target autosave' \
            '- Balatro L3: Deck/Stake selection + Blind Select + Skip/Tag flow' \
            '- Boss Blind effects + cumulative Stake rules + Eternal/Perishable/Rental Jokers' \
            '- First deep Joker set: 50 functional Jokers with scaling and retriggers' \
            '- Left-click Joker/Consumable info card + Balatro-like Shop composition' \
            '- Joker Exact Parity: per-card/on-held/independent timing, Red Seal/Mime/retrigger order' \
            '- Exact live counters for Misprint/Runner/Ride the Bus/Green/Ice Cream/Loyalty/Castle' \
            '- Boss-debuff-aware Joker/Card interactions + single-roll Glass shatter settlement' \
            '- 20 Mythic Jokers above Rare with dedicated rarity visuals and 2% natural roll' \
            '- Persistent meta progression: Deck/Stake unlocks, Joker unlock/discovery and Collection' \
            '- Seeded New Run flow with stable text-to-seed hashing' \
            '- Complete 24 Tag catalog and 28 Boss Blind catalog including 5 showdown Bosses' \
            '- Boss runtime save/restore + concealed-card rendering + Crimson/Verdant/Pillar/Cerulean effects' \
            '- Reliability Certification: 750 randomized full-run seeds per build' \
            '- Reliability invariants: finite state, card conservation, capacity, deterministic RNG, save/restore equivalence, Boss liveness' \
            '- Portrait mobile UI: safe-area layout, horizontal-scroll lock and long-press text-selection protection' \
            '- Content parity: 15 Decks + 32 Vouchers + 22 Tarot + 12 Planet + 18 Spectral' \
            '- Magic/Nebula/Ghost/Abandoned/Checkered/Zodiac/Painted/Anaglyph/Plasma/Erratic Deck behavior' \
            '- Full Voucher upgrade pairs including Observatory/Omen Globe/Antimatter/Retcon/Palette' \
            '- Full Tarot and Spectral execution including Fool/Wheel/Strength/Temperance/Soul/Black Hole' \
            '- Exact Meta Progression: per-Deck Stakes, individual Deck/Joker/Voucher unlock conditions' \
            '- Seeded practice runs are meta-ineligible: no unlocks, discovery, stats or Stake stickers' \
            '- Collection tabs: Decks/Jokers/Vouchers/Tarot/Planet/Spectral/Blinds/Tags' \
            '- Permanent highest-Stake stickers on Jokers held through winning Ante 8' \
            > open-poker-game/SOURCE_INFO.txt
          rm -rf .open-poker-build

      - name: Commit built game
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add open-poker-game
          if git diff --cached --quiet; then
            echo "No Open Poker build changes."
            exit 0
          fi
          git commit -m "feat(game): add customized Open Poker"
          git push
