name: Build Open Poker for Kanban

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-open-poker.yml"
      - ".github/scripts/customize_open_poker.py"
      - ".github/scripts/enhance_open_poker_ux.py"
      - ".github/scripts/balatro_core_parity.py"

permissions:
  contents: write

concurrency:
  group: build-open-poker-kanban
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kanban
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Open Poker
        run: |
          set -euo pipefail
          rm -rf .open-poker-build
          git clone --depth 1 https://github.com/alexis-labs/open-poker.git .open-poker-build

      - name: Apply Kanban customization
        run: |
          python3 .github/scripts/customize_open_poker.py .open-poker-build
          python3 .github/scripts/enhance_open_poker_ux.py .open-poker-build
          python3 .github/scripts/balatro_core_parity.py .open-poker-build

      - name: Build Open Poker
        run: |
          set -euo pipefail
          cd .open-poker-build
          npm ci --no-audit --no-fund
          npm run gen-art
          npm run typecheck
          npm run test
          npm run build

      - name: Stage game for Kanban
        run: |
          set -euo pipefail
          rm -rf open-poker-game
          mkdir -p open-poker-game
          cp -a .open-poker-build/dist/. open-poker-game/
          cp .open-poker-build/LICENSE open-poker-game/LICENSE_OPEN_POKER.txt
          printf '%s\n' \
            'Open Poker integration for Kanban-QLCV-Linh' \
            'Upstream: https://github.com/alexis-labs/open-poker' \
            'License: MIT (see LICENSE_OPEN_POKER.txt)' \
            'Kanban customizations:' \
            '- Card ranks 2..A enlarged more than 2x for readability' \
            '- Sort Hand: Straight (S)' \
            '- Sort Hand: Flush (F) with sticky auto-sort' \
            '- Play Hand hotkey: Left/Right Ctrl' \
            '- Discard hotkey: Left/Right Shift' \
            '- Run Info: hand level, Chips x Mult, played count' \
            '- Options: SFX, music, new run, save and return' \
            '- Current run autosaves/restores; ESC closes panel or returns to Kanban' \
            '- Balatro Core Parity: ordered scoring/retriggers/held-card/Joker pass' \
            '- Full playing-card modifiers: enhancements, seals, editions' \
            '- Deterministic Lucky/Glass rolls + Glass shatter + money effects' \
            '- Drag Joker order affects scoring left-to-right' \
            > open-poker-game/SOURCE_INFO.txt
          rm -rf .open-poker-build

      - name: Commit built game
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add open-poker-game
          if git diff --cached --quiet; then
            echo "No Open Poker build changes."
            exit 0
          fi
          git commit -m "feat(game): add customized Open Poker"
          git push
