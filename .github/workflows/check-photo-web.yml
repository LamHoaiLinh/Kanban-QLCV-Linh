name: Kan Photo Web Checks
on:
  push:
    paths:
      - 'office-tools/photo-studio.js'
      - 'office-tools/office-tools.js'
      - '.github/workflows/check-photo-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check office-tools/photo-studio.js
          node --check office-tools/office-tools.js
      - name: Assert menu integration
        run: |
          grep -q 'data-office-nav' office-tools/office-tools.js
          grep -q 'renderPhotoStudioTool' office-tools/office-tools.js
          grep -q 'XỬ LÝ TẤT CẢ' office-tools/photo-studio.js
