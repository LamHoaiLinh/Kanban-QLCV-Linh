name: Kan Photo Web Checks
on:
  push:
    paths:
      - 'office-tools/photo-studio.js'
      - 'office-tools/photo-preview.js'
      - 'office-tools/photo-filters.js'
      - 'office-tools/photo-warp.js'
      - 'office-tools/photo-preview.css'
      - 'tests/photo-web-smoke.mjs'
      - 'office-tools/photo-studio.css'
      - 'office-tools/office-tools.js'
      - '.github/workflows/check-photo-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check office-tools/photo-studio.js
          node --check office-tools/photo-preview.js
          node --check office-tools/photo-filters.js
          node --check office-tools/photo-warp.js
          node --check office-tools/office-tools.js
      - name: Assert menu integration
        run: |
          grep -q 'data-office-nav' office-tools/office-tools.js
          grep -q 'renderPhotoStudioTool' office-tools/office-tools.js
          grep -q 'MỞ PREVIEW CHỈNH SỬA' office-tools/photo-studio.js
          grep -q 'kanPhotoDownload' office-tools/photo-studio.js
          grep -q 'openPhotoPreview' office-tools/photo-studio.js
          grep -q 'correctPerspective' office-tools/photo-preview.js
          grep -q 'kpe-modal' office-tools/photo-preview.css

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium runner
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Test actual web UI
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/kanphoto-http.log 2>&1 &
          sleep 2
          node tests/photo-web-smoke.mjs
