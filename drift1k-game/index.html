<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DRIFT CAR</title>
<style>
  :root{
    --bg:#081225;
    --text:#edf4ff;
    --muted:#9fb2cf;
    --line:#274777;
    --accent:#38bdf8;
    --shadow:0 14px 40px rgba(0,0,0,.35);
    font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#102346 0%,#081225 48%,#050c19 100%);color:var(--text);padding:18px}
  .app{max-width:1120px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  h1{margin:0;font-size:28px;letter-spacing:.08em;font-weight:900}
  .top-actions{display:flex;gap:10px;flex-wrap:wrap}
  .mode-btn,.mini-btn,.turn-btn,.overlay-main-btn,.player-card,.ui-btn,.swatch{border:1px solid var(--line);background:linear-gradient(180deg,#1d3563,#112342);color:var(--text);border-radius:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .06s ease,filter .15s ease,border-color .15s ease}
  .mode-btn:hover,.mini-btn:hover,.turn-btn:hover,.overlay-main-btn:hover,.player-card:hover,.ui-btn:hover,.swatch:hover{filter:brightness(1.08)}
  .mode-btn:active,.mini-btn:active,.turn-btn:active,.overlay-main-btn:active,.player-card:active,.ui-btn:active,.swatch:active{transform:translateY(1px)}
  .mode-btn{padding:12px 18px;min-width:96px;font-size:16px;font-weight:800}
  .mode-btn.active{border-color:var(--accent);outline:2px solid rgba(56,189,248,.25)}
  .back-kanban-btn{border-color:#63c49a;background:linear-gradient(180deg,#1d5d49,#10372c);min-width:154px}
  .hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .player-card{padding:12px;text-align:left;min-height:86px}
  .player-card.inactive{opacity:.38;cursor:not-allowed;filter:none}
  .player-card.active{border-color:var(--accent);outline:2px solid rgba(56,189,248,.18)}
  .player-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .player-name{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .player-score{font-size:12px;color:var(--muted);font-weight:800}
  .fuel-track{height:12px;background:#060c18;border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
  .fuel-fill{height:100%;border-radius:999px;transition:width .08s linear}
  .player-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#d6e4fb;margin-top:8px}
  .frame{position:relative;background:#020816;padding:12px;border-radius:22px;box-shadow:var(--shadow);border:1px solid rgba(90,129,188,.22)}
  canvas{display:block;width:min(100%,900px);height:auto;aspect-ratio:1/1;margin:0 auto;background:#a28879;border-radius:12px;image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
  .overlay-note{position:absolute;left:22px;right:22px;top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}
  .overlay-pill{background:rgba(4,10,22,.76);border:1px solid rgba(255,255,255,.08);padding:7px 12px;border-radius:999px;font-size:12px;color:#dbeafe;font-weight:800}
  .mini-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
  .mini-btn{padding:8px 12px;font-size:13px;font-weight:800}
  .overlay-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none}
  .overlay-center.hidden{display:none}
  .start-card{pointer-events:auto;background:rgba(12,18,30,.88);border:4px solid #dce8ff;border-radius:0;padding:28px 26px;min-width:min(76%,520px);text-align:center;box-shadow:var(--shadow)}
  .start-card.result-panel{background:transparent;border:none;box-shadow:none;min-width:auto;padding:0;align-self:flex-end;margin-bottom:32px}
  .start-card h2{margin:0 0 18px;font-size:36px;letter-spacing:.08em;color:#ffe082;font-family:Consolas,"Courier New",monospace}
  .start-card.result-panel h2{display:none}
  .overlay-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .overlay-secondary-btn{padding:16px 22px;font-size:20px;font-weight:900;border-radius:18px;border:1px solid #7aa5d4;background:linear-gradient(180deg,#243d66,#13233d);box-shadow:0 10px 0 #091523,0 16px 24px rgba(0,0,0,.35);color:#fff;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;pointer-events:auto}
  .overlay-secondary-btn:active{transform:translateY(4px);box-shadow:0 6px 0 #091523,0 10px 18px rgba(0,0,0,.3)}
  .overlay-main-btn{padding:18px 28px;font-size:26px;font-weight:900;border-radius:18px;border-color:#8fc7ff;background:linear-gradient(180deg,#42a5ff,#0f4ca8);box-shadow:0 12px 0 #07295d,0 16px 28px rgba(0,0,0,.35);text-transform:uppercase;letter-spacing:.06em;color:#fff}
  .overlay-main-btn:active{transform:translateY(4px);box-shadow:0 8px 0 #07295d,0 12px 20px rgba(0,0,0,.28)}
  .turn-controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
  .turn-btn{padding:14px 10px;font-size:16px;border-radius:16px;font-weight:900}
  .turn-btn small{display:block;font-size:12px;font-weight:700;color:#d7e7ff;opacity:.95;margin-top:3px}
  .turn-btn:disabled{opacity:.35;cursor:not-allowed;filter:none}

  .modal-backdrop{position:fixed;inset:0;background:rgba(4,10,20,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}
  .modal-backdrop.show{display:flex}
  .modal{width:min(92vw,540px);background:linear-gradient(180deg,rgba(18,31,59,.98),rgba(10,21,41,.98));border:1px solid rgba(90,129,188,.35);border-radius:22px;box-shadow:var(--shadow);padding:18px}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .modal-title{font-size:22px;font-weight:900}
  .key-badge{padding:6px 10px;border-radius:999px;background:#0b1730;border:1px solid rgba(115,150,203,.28);color:#cfe6ff;font-size:12px;font-weight:800}
  .field-label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .name-input{width:100%;padding:12px 13px;border-radius:12px;border:1px solid #28456f;background:#0a1730;color:var(--text);font-size:15px;font-weight:700;margin-bottom:10px}
  .name-input:focus{outline:2px solid rgba(56,189,248,.25);border-color:var(--accent)}
  .palette-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .swatch{position:relative;height:42px;border:2px solid transparent;overflow:hidden}
  .swatch.selected{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
  .swatch.taken{opacity:.28;cursor:not-allowed;filter:grayscale(.2)}
  .swatch .tag{position:absolute;right:5px;bottom:4px;font-size:9px;font-weight:900;background:rgba(8,18,37,.78);padding:1px 4px;border-radius:999px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  .ui-btn{padding:11px 16px;font-size:14px;font-weight:900}
  .ui-btn.warn{border-color:#b68b0d;background:linear-gradient(180deg,#f0c419,#9b7a12);color:#111827}
  .ui-btn.ghost{background:linear-gradient(180deg,#142746,#0f1d36)}
  @media (max-width:980px){.hud,.turn-controls{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:640px){body{padding:10px}h1{font-size:24px}.mode-btn,.turn-btn,.overlay-main-btn{font-size:14px}.overlay-main-btn{padding:14px 20px}.hud,.turn-controls{grid-template-columns:1fr}.start-card h2{font-size:28px}.modal{padding:14px}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <h1>DRIFT CAR</h1>
    <div class="top-actions" id="modeButtons">
      <button class="mode-btn back-kanban-btn" id="backKanbanBtn">← Quay về KanBan</button>
      <button class="mode-btn active" data-count="1">1 người</button>
      <button class="mode-btn" data-count="2">2 người</button>
      <button class="mode-btn" data-count="3">3 người</button>
      <button class="mode-btn" data-count="4">4 người</button>
    </div>
  </div>

  <div class="hud" id="hud"></div>

  <div class="frame">
    <div class="overlay-note">
      <div class="overlay-pill" id="matchInfo">Chưa bắt đầu</div>
      <div class="mini-actions">
        <button class="mini-btn" id="pauseBtn">Tạm dừng</button>
        <button class="mini-btn" id="resumeBtn">Tiếp tục</button>
        <button class="mini-btn" id="restartBtn">Chơi lại</button>
      </div>
    </div>
    <canvas id="game" width="512" height="512" tabindex="0" aria-label="DRIFT CAR"></canvas>
    <div class="overlay-center" id="centerStartWrap">
      <div class="start-card" id="overlayCard">
        <h2 id="overlayTitle">DRIFT CAR</h2>
        <div class="overlay-actions">
          <button class="overlay-secondary-btn" id="menuBtn" style="display:none">Về Menu</button>
          <button class="overlay-main-btn" id="startBtn">BẮT ĐẦU</button>
        </div>
      </div>
    </div>
  </div>

  <div class="turn-controls" id="turnControls"></div>
</main>

<div class="modal-backdrop" id="playerModalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Sửa người chơi</div>
      <div class="key-badge" id="modalKeyBadge">Phím</div>
    </div>
    <label class="field-label" for="modalNameInput">Tên hiển thị</label>
    <input id="modalNameInput" class="name-input" type="text" maxlength="16">
    <div class="field-label">Chọn màu</div>
    <div class="palette-grid" id="modalPaletteGrid"></div>
    <div class="modal-actions">
      <button class="ui-btn ghost" id="modalCloseBtn">Đóng</button>
      <button class="ui-btn ghost" id="modalContinueBtn">Chơi tiếp</button>
      <button class="ui-btn ghost" id="modalRestartBtn">Chơi lại</button>
      <button class="ui-btn warn" id="resetNamesBtn">Đặt lại tên & màu</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
