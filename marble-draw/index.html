<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173a30">
  <title>Marble Draw – Đường đua may mắn</title>
  <link rel="stylesheet" href="styles.css?v=1.2.1">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
      "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/rapier.mjs"
    }
  }
  </script>
</head>
<body>
  <div class="md-app">
    <header class="md-header">
      <div class="md-brand">
        <div class="md-logo" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><div class="md-eyebrow">BỐC THĂM VẬT LÝ 3D</div><h1>MARBLE DRAW</h1><p>Đường đua may mắn – xử lý hoàn toàn trên thiết bị</p></div>
      </div>
      <div class="md-header-actions">
        <button id="fullscreenBtn" class="md-icon-btn" type="button" data-tip="Mở toàn màn hình trình chiếu" aria-label="Toàn màn hình">⛶</button>
        <button id="soundBtn" class="md-icon-btn active" type="button" data-tip="Bật hoặc tắt âm thanh" aria-label="Âm thanh">♪</button>
        <button id="settingsBtn" class="md-icon-btn" type="button" data-tip="Mở cài đặt và dữ liệu" aria-label="Cài đặt">⚙</button>
        <button id="closeDrawBtn" class="md-close-btn" type="button">Quay về Kanban</button>
      </div>
    </header>
    <div class="md-shell no-sidebar"><main id="mainView" class="md-main solo" tabindex="-1"></main></div>
  </div>
  <div id="raceStage" class="race-stage" hidden>
    <canvas id="raceCanvas"></canvas>
    <div class="race-topbar">
      <div><span id="raceModeBadge" class="race-badge">CHẠY THỬ</span><strong id="raceEventName">Sự kiện</strong></div>
      <div class="race-top-actions"><button id="raceSoundBtn" class="md-icon-btn" type="button">♪</button><button id="exitRaceBtn" class="md-close-btn" type="button">Thoát đường đua</button></div>
    </div>
    <div class="race-scoreboard">
      <div id="digitSlots" class="digit-slots"></div>
      <div id="raceRoundLabel" class="race-round-label">Hàng trăm</div>
      <div id="raceCandidateInfo" class="race-candidate-info"></div>
    </div>
    <div id="raceCountdown" class="race-countdown" hidden>3</div>
    <div id="raceWinner" class="race-winner" hidden></div>
    <div id="raceRanking" class="race-ranking"></div>
    <div id="raceStatus" class="race-status">Đang tải engine vật lý…</div>
    <div id="raceControls" class="race-controls"><button id="startDigitBtn" class="md-primary-btn" type="button">Bắt đầu lượt</button><button id="resetSequenceBtn" class="md-secondary-btn" type="button" hidden>Quay lại toàn bộ chuỗi</button></div>
  </div>
  <dialog id="settingsDialog" class="md-dialog">
    <form method="dialog" class="md-dialog-card">
      <div class="md-dialog-head"><div><span class="md-eyebrow">CÀI ĐẶT</span><h2>Dữ liệu Marble Draw</h2></div><button value="close" class="md-icon-btn">×</button></div>
      <label class="md-field"><span>Chất lượng đồ họa</span><select id="qualitySelect"><option value="low">Thấp</option><option value="medium" selected>Trung bình</option><option value="high">Cao</option></select></label>
      <label class="md-field"><span>Âm lượng</span><input id="volumeInput" type="range" min="0" max="1" step="0.01" value="0.6"></label>
      <div class="md-danger-zone"><strong>Xóa riêng dữ liệu Marble Draw</strong><p>Không ảnh hưởng dự án, công việc, ghi chú hoặc dữ liệu Kanban.</p><button id="deleteDrawDataBtn" class="md-danger-btn" type="button">Xóa dữ liệu Marble Draw</button></div>
      <div class="md-dialog-actions"><button value="close" class="md-primary-btn">Đóng</button></div>
    </form>
  </dialog>
  <dialog id="confirmDialog" class="md-dialog"><form method="dialog" class="md-dialog-card compact"><h2 id="confirmTitle">Xác nhận</h2><p id="confirmText"></p><div class="md-dialog-actions"><button value="cancel" class="md-secondary-btn">Hủy</button><button value="ok" class="md-danger-btn">Xác nhận</button></div></form></dialog>
  <div id="toast" class="md-toast" role="status"></div>
  <script type="module" src="js/app.js?v=1.2.1"></script>
</body>
</html>
